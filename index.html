 2026",sensex:{value:"83,919.71",pct:"+1.08%",points:"+897.96",up:!0,earlier:{at:"Thu",value:83021.75},now:83919.71},nifty:{value:"25,800.60",pct:"+1.12%",points:"+286.30",up:!0,earlier:{at:"Thu",value:25514.3},now:25800.6}},fr={nz:"368",ind:"159/1",trail:"209"},mu=[{id:"gta",headline:"Game night: GTA VI is out",asOf:"Announced Thu 19 Nov 2026",bullets:["Rockstar Games, a Take-Two label, announced on 19 November 2026 that Grand Theft Auto VI is now available on PlayStation 5 and Xbox Series X|S.","Only those two consoles are named in the announcement.","The release calls the game the highest rated of all time and quotes early reviews. That is the company’s own claim."],note:"The two players and their glowing TV are an illustration, not gameplay footage. Nothing newer than the 19 November announcement was found on 20 November.",sources:[{label:"Take-Two Interactive press release, 19 Nov 2026",href:"https://www.take2games.com/ir/news/rockstar-games-announces-grand-theft-auto-vi-now-available"}]},{id:"cyclone",headline:"Cyclone Akvan crossed the Odisha coast and is weakening",asOf:"Fri 20 Nov 2026, India Today report of 4:37 PM IST",bullets:["The India Meteorological Department said Akvan crossed the south Odisha and north Andhra Pradesh coast close to Gopalpur between 7:30 and 8:30 AM on 20 November, with winds of 70 to 80 kmph gusting to 90 kmph.","By 11:30 AM it had weakened into a deep depression. IMD expects it to become a depression, then a well-marked low-pressure area by late night on 20 November.","Heavy rain fell in coastal Odisha. Patrapur in Ganjam recorded the most, 209 mm in 24 hours. Rain may continue in parts of Odisha and neighbouring West Bengal.","State officials reported no major damage or loss of life in the initial assessment. More than 3.7 lakh people were moved to safer places beforehand.","Earlier, the Odisha Chief Secretary said low-lying urban areas were filled with rainwater. The scene shows only small puddles on low ground, and no flooded homes or streets, because none were reported."],note:"The swirl is a toy model of the storm at the coast. The wind makes the ODISHA letters jump, and the line of people walking to the shelter is the evacuation. No destruction is depicted.",sources:[{label:"India Today: Cyclone Akvan to weaken by tonight, 20 Nov 2026",href:"https://www.indiatoday.in/science/story/cyclone-akvan-weakens-after-odisha-landfall-imd-rain-storm-disaster-3043155-2026-11-20"},{label:"The Hindu: Cyclone Akvan crosses Odisha coast, 20 Nov 2026",href:"https://www.thehindu.com/news/national/cyclone-akvan-odisha-andhra-pradesh-landfall-imd-updates/article71722866.ece"}]},{id:"cricket",headline:"Cricket: India reply strongly in Wellington",asOf:"Day 2 stumps, Fri 20 Nov 2026 (New Zealand time)",bullets:[`New Zealand were all out for ${fr.nz} in the first Test at the Basin Reserve, Wellington. Henry Nicholls finished unbeaten on 175 and Glenn Phillips made 118, in a stand of 216.`,`India ended day 2 on ${fr.ind}, trailing by ${fr.trail} runs. Openers Yashasvi Jaiswal and KL Rahul added 130 for the first wicket. Jaiswal made 85 from 89 balls and Rahul was 52 not out.`,"Jasprit Bumrah took four wickets and Akash Deep three for India."],note:"This is the day 2 stumps score. Day 3 had not started when this page was last checked, so the scoreboard in the scene is fixed and does not update.",sources:[{label:"AP: India ends Day 2 at 159-1 in reply to New Zealand’s 368",href:"https://apnews.com/article/cricket-new-zealand-india-1st-test-f81df4378452cf7b12066bc243369bdb"},{label:"ESPNcricinfo: Day 2 match report",href:"https://www.cricinfo.com/series/india-in-new-zealand-2026-27-1539421/new-zealand-vs-india-1st-test-1539442/match-report-2"}]},{id:"market",headline:"Markets: Sensex and Nifty end higher",asOf:`${Qe.date}, closing levels. Not live.`,bullets:[`The Sensex closed up ${Qe.sensex.points} points (${Qe.sensex.pct}) at ${Qe.sensex.value}.`,`The Nifty 50 closed up ${Qe.nifty.points} points (${Qe.nifty.pct}) at ${Qe.nifty.value}.`,"Banking stocks led: the Nifty Bank index rose about 2.5 per cent. Breadth was weak, with 1,582 stocks advancing and 2,456 declining on the exchange.","The little chart joins Thursday’s close, worked out from the day’s change, to Friday’s close. It is not an intraday chart."],note:"Green means up, red would mean down. These are the final closing numbers for 20 November. The page does not refresh them, and Monday’s trading will change the picture.",sources:[{label:"Hindustan Times: Sensex jumps over 890 points, Nifty at 25,800.60",href:"https://www.hindustantimes.com/business/sensex-jumps-over-890-points-nifty-up-by-280-points-to-to-2580060-101795168161123.html"},{label:"ET Now: Closing Bell, Nifty and Sensex end higher",href:"https://www.etnownews.com/markets/closing-bell-nifty-sensex-end-higher-despite-weak-market-breadth-banking-stocks-steal-the-show-article-156541891"}]},{id:"epfo",headline:"EPFO board eases PF withdrawals",asOf:"Board meeting Thu 19 Nov 2026, PIB release 6:28 PM",bullets:["The EPFO Central Board of Trustees approved a lower minimum balance for PF members: down from 25% to 10% of contributions.","It also cut the waiting period for a final PF withdrawal from 12 months to 2 months.","It approved a voluntary Systematic Withdrawal Plan, so retiring members can take their PF savings in regular instalments instead of one lump sum. Amendments to the EPF scheme are to be notified after the Labour Ministry approves.","The release does not say when the new minimum balance and waiting period take effect."],note:"The piggy bank, coin tap and little office are an illustration. The two boards show the numbers from the release, and the pot with a tap stands for the Systematic Withdrawal Plan.",sources:[{label:"PIB: 240th meeting of the EPF Central Board of Trustees, 19 Nov 2026",href:"https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2338667&lang=2&reg=48"}]},{id:"cheetah",headline:"Four cheetah cubs born at Kuno",asOf:"Reported Fri 20 Nov 2026",bullets:["A two-and-a-half-year-old female cheetah brought from Botswana, KOMG 3, gave birth to four cubs in the wild at Kuno National Park in Madhya Pradesh.","This takes India’s cheetah count to 62, of which 43 were born in India.","Kuno’s director said all four cubs are healthy.","It is the second recorded birth in the wild since the reintroduction began in 2022, and the first to a female from Botswana."],note:"The cheetahs and the cubs trotting around her are an illustration, not photographs.",sources:[{label:"The Indian Express: Kuno gets new cheetah mother, 20 Nov 2026",href:"https://indianexpress.com/article/india/cheetah-from-botswana-is-kunos-latest-mom-4-cubs-take-indias-population-to-62-10971264/"}]},{id:"insurance",headline:"Health insurance: clearer claims planned",asOf:"IRDAI chairman, Thu 19 Nov 2026, reported Fri 20 Nov",bullets:["Insurance regulator IRDAI is forming two industry working groups on health insurance claims, expected within about 10 days.","One will look at real-time visibility of a claim: pre-authorisation, hospital discharge and final settlement.","The other will set common measures for claims and complaint handling, and standard reasons for full or partial rejection, so insurers can be compared.","These are plans. Nothing is live yet, and policyholders cannot track claims in real time because of this announcement."],note:"The claim tracker on the wall is marked as planned. The two tables are the two working groups. It is an illustration, not a real system.",sources:[{label:"ETHealthworld (PTI): IRDAI to set up industry working groups, 20 Nov 2026",href:"https://health.economictimes.indiatimes.com/news/insurance/irdai-to-set-up-industry-working-groups-to-improve-health-insurance-claim-transparency/136009988"}]},{id:"service",headline:"Restaurant service charge stays optional",asOf:"Delhi High Court, Thu 19 Nov 2026, reported Fri 20 Nov",bullets:["The Delhi High Court did not grant interim relief to the restaurant bodies
